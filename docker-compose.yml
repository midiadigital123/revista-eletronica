services:
  mongo:
    image: mongo:7
    container_name: revista-mongo
    # Replica set de 1 nó: necessário para transações (regra do último admin, D-019).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-dados:/data/db
    # Inicia o replica set na primeira vez e depois só confere se está pronto.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: revista-api
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/revista?replicaSet=rs0
      REVISTA_DIR: /app/revista
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  editor:
    build:
      context: ./editor
      dockerfile: Dockerfile
    container_name: revista-editor
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Sistema novo (Django + PostgreSQL). Sem container_name e sem porta do
  # Postgres no host: cada worktree roda como um projeto compose separado.
  # Defaults só de desenvolvimento; o .env da raiz sobrescreve (ver app/.env.example).
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: revista
      POSTGRES_USER: revista
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revista}
    volumes:
      - pg-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "revista", "-d", "revista"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: ./app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://revista:${POSTGRES_PASSWORD:-revista}@db:5432/revista}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-inseguro-nao-usar-em-producao}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongo-dados:
  pg-dados:
